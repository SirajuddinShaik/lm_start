# Default prompts used by the agentic system
# These are fallback prompts when specific ones are not provided

# =============================================================================
# Strategy Consultation Prompts
# =============================================================================

strategy_consultation: |
  You are a vLLM optimization expert analyzing model deployment strategies.

  Current Context:
  - Model Size: {{model_size_gb}} GB
  - Available GPUs: {{gpu_count}} x {{gpu_memory_gb}}GB each
  - Tested Configs: {{tested_count}}
  - Working Configs: {{working_count}}

  Previous Results:
  {{previous_results}}

  Recent Errors:
  {{recent_errors}}

  Based on this information, provide your analysis in JSON format:
  {
    "analysis": "Brief analysis of the situation",
    "continue": true/false,
    "reasoning": "Why continue or stop",
    "suggested_focus": "What to prioritize next"
  }

# =============================================================================
# Error/Fix Consultation Prompts
# =============================================================================

error_analysis: |
  An error occurred during vLLM optimization.

  Error Type: {{error_type}}
  Error Message: {{error_message}}
  Phase: {{phase}}

  Action History:
  {{action_history}}

  Suggest fixes in JSON format:
  {
    "analysis": "Brief analysis of the error",
    "suggested_fixes": [
      {
        "action": "action_name",
        "command": "shell command to run",
        "description": "what this does",
        "priority": 1
      }
    ],
    "continue": true/false
  }

# =============================================================================
# Mock LLM Responses (for testing/development)
# =============================================================================

# Used by _smart_mock_llm_call when no real LLM is available
mock_responses:
  next_tests: |
    {
      "analysis": "Based on current results, continue testing higher contexts with best backend",
      "next_tests": [
        {"context": 65536, "backend": "FLASHINFER", "reason": "Test upper bound"}
      ],
      "focus_backend": "FLASHINFER",
      "estimated_max_context": 65536,
      "should_continue": true
    }

  error_fix: |
    {
      "analysis": "Configuration needs adjustment due to resource constraints",
      "suggested_fixes": [
        {"action": "reduce_context", "value": 8192, "reason": "Memory constraint"},
        {"action": "reduce_gpu_memory_util", "value": 0.85, "reason": "Leave more headroom"}
      ],
      "continue": true
    }

  strategy: |
    {
      "analysis": "Continue with systematic search approach",
      "continue": true,
      "reasoning": "Binary search between known good and bad configs is efficient",
      "recommended_approach": "Test midpoint between last success and first failure"
    }

  default: |
    {
      "analysis": "Continue optimization process with standard parameters",
      "continue": true,
      "fallback": true
    }
