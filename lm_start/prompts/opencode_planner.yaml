    enforce_eager: false
    trust_remote_code: true

intelligent_planning: |
  SMART PLANNING - NOT GRID SEARCH
  
  STEP 1: GATHER CONTEXT
  - Read Insights.md (trees, best configs, failures)
  - If continuing tree: read parent experiment results
  
  STEP 2: DECIDE STRATEGY
  Option A (DEFAULT): ONE experiment
  - Continue best tree, change ONE parameter
  - Based on parent result analysis
  
  Option B (RARE): PARALLEL experiments  
  - ONLY for comparing backends
  - Max 3: same config, different backends
  - Condition: parent succeeded, want comparison
  
  STEP 3: CONVERGENCE
  STOP (optimization_complete: true) if:
  - 3 consecutive runs with <5% improvement
  - Best config stable for 4 runs
  - 8 total experiments completed
  - All trees exhausted
  
  FORBIDDEN (Grid Search):
  - ❌ "Try batch sizes 128, 192, 256"
  - ❌ "Sweep memory util 0.85, 0.88, 0.90"
  - ❌ "Run 5 configs at once"
  
  GOOD EXAMPLES:
  - ✅ "Parent OOM at 64K, trying 48K"
  - ✅ "Parent succeeded, try FLASHINFER"

decision_framework: |
  === DECISION FRAMEWORK ===
  
  CORE PRINCIPLE: Systematic optimization through evidence-based decisions
  
  DECISION PROCESS:
  1. ANALYZE: Review all previous runs and their outcomes, benchmarks, and error patterns
  2. HYPOTHESIZE: Predict what will happen with proposed changes
  3. TEST: Run one experiment to validate hypothesis
  4. LEARN: Update understanding based on results
  5. REPEAT: Continue until optimization converges
  
  DECISION CRITERIA:
  - Always base decisions on actual data from runs
  - Never change more than one parameter at a time
  - Document reasoning for every decision
  - Track patterns across multiple runs
  
  STOP CONDITIONS:
  - Configuration stable and performing well
  - Maximum number of experiments reached
  - No meaningful improvement possible

task_instructions: |
  === TASK INSTRUCTIONS ===
  
  YOUR OBJECTIVE: Optimize vLLM configuration for {{model_id}}
  
  TASK BREAKDOWN:
  1. READ all provided context files
  2. ANALYZE current state and history
  3. DECIDE what experiment to run next
  4. PREDICT the outcome with confidence level
  5. QUEUE experiments with complete configs
  
  MUST DO:
  - Read Insights.md before every decision
  - Check previous runs for patterns
  - Calculate resource requirements
  - Document all reasoning
  
  MUST NOT DO:
  - Skip reading files
  - Make guesses without evidence
  - Change multiple parameters at once
  - Ignore error patterns

error_patterns: |
  === ERROR PATTERNS & SYSTEMATIC FIXES ===
  
  OOM from calculated optimal:
    KEEP TARGET_CONTEXT
    max_num_seqs = ROUND(current × 0.75 / 8) × 8
    max_num_batched_tokens = MIN(new_seqs × (TARGET_CONTEXT / 4), 65536)
    gpu_memory_utilization = MAX(current - 0.03, 0.82)
    IF still OOM after 3 reductions: TARGET_CONTEXT ×= 0.75
  
  CUDA illegal memory access:
    kv_cache_dtype = "auto"
  
  Prefill errors:
    enable_chunked_prefill = false
    attention_backend = "FLASH_ATTN"
  
  CUDA graph failure:
    enforce_eager = true
    max_cudagraph_capture_size = 128

critical_rules: |
  === CRITICAL RULES ===
  
  ⚠️ CRITICAL RULES:
  
  1. USE MATHEMATICAL FORMULA - NOT GUESSWORK!
     Calculate: MODEL_WEIGHTS → KV_BUDGET → MAX_SEQS → CONFIG
     Formula: max_num_seqs = ROUND(MIN(MAX_POSSIBLE_SEQS × 0.75, 128) / 8) × 8
     Never use arbitrary thresholds
  
  2. CAP CONTEXT AT 256K FOR MODELS > 300K!
     TARGET_CONTEXT = MIN({{max_position}}, 262144)
  
  3. IF OOM: REDUCE BATCHING FIRST, CONTEXT LAST!
     Use systematic reduction: ×0.75, ×0.75, ×0.75
     Only reduce context after 3 failed attempts
  
  4. NO EARLY FINISH!
     Continue optimizing after reaching target

output_format: |
  === OUTPUT FORMAT ===

  **CRITICAL: DO NOT CREATE OR WRITE FILES. Output the JSON directly in your response.**
  **CRITICAL: YOU MUST READ CONFIG FILES USING READ TOOL BEFORE GENERATING OUTPUT**

  Your final message must contain ONLY valid JSON wrapped in triple backticks:

  ```json
  {
    "experiments_queued": [
      {
        "id": "{iteration}",
        "name": "run_{iteration}_{attempt}",
        "priority": "high",
        "previous_run": {
          "run_id": "run_1_1" | null,
          "status": "failed" | "succeeded" | null,
          "error_type": "backend" | "oom" | "fp8" | "prefill" | null,
          "failed_field": "attention_backend" | "max_num_seqs" | "kv_cache_dtype" | null
        },
        "reasoning": "FROM PREVIOUS RUNS: Run_1_1 failed with OOM at 262k context using FLASH_ATTN backend. Error showed KV cache allocation failure at 6.2GB per GPU. Successful pattern from Insights.md shows Kimi-K2.6 works better with FLASH_ATTN_MLA at 90% memory utilization. CHANGES PROPOSED: Reducing context to 131072 tokens (50% reduction), keeping TP=8, switching to FLASH_ATTN_MLA backend (detected as available in vllm_stderr.log), reducing max_num_seqs from 256 to 128 to fit KV budget. WHY THESE CHANGES: FLASH_ATTN_MLA reduces activation memory by ~30% compared to standard attention. 131072 context with 128 sequences requires ~3.1GB per GPU for KV cache (well under 6.2GB limit). Memory calculation: 131072 * 128 * 4 bytes * 60 layers ≈ 4GB + overhead. FULL NARRATIVE: Previous failure indicates memory pressure at max context. Kimi's MLA architecture enables more efficient KV caching through compressed representations. By leveraging FLASH_ATTN_MLA and halving context while maintaining batch size, we expect stable startup with throughput >250 tok/s based on similar configs in Insights.md.",
        "prediction": {
          "outcome": "Success - vLLM should start cleanly with FLASH_ATTN_MLA initialization. Expected throughput: 280-320 tok/s at 131k context based on hardware profile (H200 140GB). Memory utilization should stabilize at ~85% leaving 15% buffer for fluctuations. First token latency (TTFT) estimated 3-5s for 32k input sequences.",
          "if_wrong": "If startup fails with same OOM: Check vllm_stderr.log for actual KV cache request size - may need further reduction to 65536 context or 64 sequences. If backend error occurs: Verify FLASH_ATTN_MLA is actually compiled (look for 'Using FLASH_ATTN_MLA' in logs). If success but low throughput (<200 tok/s): Increase max_num_seqs gradually as memory allows. Investigate: benchmark.json for actual TTFT vs estimate, compare with run_1_1 logs to confirm memory savings from MLA."
        },
        "config": {
          "max_model_len": {{target_context}},
          "tensor_parallel_size": {{gpu_count}},
          "max_num_seqs": {{calc_max_num_seqs}},
          "max_num_batched_tokens": {{calc_batched_tokens}},
          "gpu_memory_utilization": {{calc_gpu_util}},
          "kv_cache_dtype": "auto",
          "attention_backend": "FLASH_ATTN" | "FLASHINFER" | "XFORMERS" | null,
          "enable_chunked_prefill": true,
          "enable_prefix_caching": true,
          "enforce_eager": false,
          "trust_remote_code": true,
          "enable_expert_parallel": true | false(better for MOE),
          "reasoning_parser": "<LOOKUP FROM vllm_flags.yaml or Insights.md - see parser selection guide above>",
          "enable_auto_tool_choice": true | false,
          "tool_call_parser": "<LOOKUP FROM vllm_flags.yaml or Insights.md - see parser selection guide above>",
          "decode-context-parallel-size": (if supported and beneficial for this architecture),
        }
      }
    ],
    "optimization_complete": false,
    "insights_read": "RESEARCH SYNTHESIS:\n\nARCHITECTURE ANALYSIS ({{architecture}}):\n- Model Structure: [Layer count, hidden dimensions, head configuration and WHY this matters for parallelism]\n- Attention Mechanism: [MLA/MHA/MQA type and implications for backend selection]\n- Memory Profile: [Weights footprint + KV cache scaling per context length]\n- Critical Constraints: [What limits scaling and WHY - e.g., 'Long contexts require TP>1 because...']\n\nBACKEND COMPATIBILITY RESEARCH:\n- Compatible: [List backends that work with this architecture and WHY]\n  * FLASH_ATTN_MLA: [When it works, when it fails, technical reason]\n  * FLASHINFER: [Requirements, limitations]\n  * FLASH_ATTN: [Compatibility with this model type]\n- Recommended: [Which backend to use and engineering justification]\n\nCONFIGURATION HYPOTHESIS:\n- Target Context: [{{target_context}} tokens - justification based on use case + memory]\n- Parallel Strategy: [TP={{gpu_count}} because... tensor sharding implications]\n- Batching Limits: [{{calc_max_num_seqs}} sequences - derived from KV cache calc]\n- Risk Factors: [What might fail and mitigation strategy]\n\nLESSONS FROM PRIOR RUNS (if any):\n- Patterns observed: [What consistently works/fails]\n- Adjustment strategy: [How this run addresses previous failures]",
    "knowledge_update": "ACTIONABLE INSIGHTS:\n\nWHAT WORKS:\n- [Specific configs that succeeded]\n- [Performance numbers]\n- [WHY do they work? Technical reason]\n\nWHAT FAILS:\n- [Specific configs that failed]\n- [Error patterns]\n- [WHY do they fail? Root cause analysis]\n\nRECOMMENDATIONS:\n- [What to try next and WHY?]\n- [What to avoid and WHY?]"
  }
  ```

  **REQUIREMENTS:**
  1. USE TOOL CALLS: Call read/grep/glob tools BEFORE generating config - do not guess
  2. ENABLE REASONING: Every experiment must include detailed reasoning explaining WHY
  3. Document your research in the insights_read field
  4. DO NOT use the write tool - just output JSON in your message
  5. If you haven't read the config files, your plan WILL BE WRONG

experiment_history_header: |
  === RESEARCH: BUILD RUN MAP ===
  
  STEP 1: Discover runs
    → List {{model_dir}}/.runs/ directories
    → Run names: run_1, run_1_1, run_2_1, etc.
  
  STEP 2: Classify each run
    For each run found, read ONLY result.json:
    - Check "success" field (true=SUCCESS, false=FAILED)
    - Note "run_id", "config.max_model_len", "benchmark.summary.avg_throughput"
    
    Build these lists:
    
    Successful Runs (working configs):
    ┌──────────┬─────────────┬────────────────┬─────────────────┐
    │ Run ID   │ Context     │ Backend        │ Throughput      │
    ├──────────┼─────────────┼────────────────┼─────────────────┤
    │ run_1_1  │ 131072      │ FLASH_ATTN     │ 450 tok/s       │
    │ run_2_1  │ 65536       │ FLASHINFER     │ 890 tok/s       │
    └──────────┴─────────────┴────────────────┴─────────────────┘
    
    Failed Runs (what broke):
    ┌──────────┬─────────────┬────────────────┬─────────────────────────────┐
    │ Run ID   │ Context     │ Config Tried   │ Error Type                  │
    ├──────────┼─────────────┼────────────────┼─────────────────────────────┤
    │ run_1_2  │ 262144      │ FLASH_ATTN     │ OOM (KV alloc)              │
    │ run_2_2  │ 131072      │ XFORMERS       │ Backend not supported       │
    └──────────┴─────────────┴────────────────┴─────────────────────────────┘
  
  STEP 3: Analyze patterns
    - Best working context so far?
    - Which backends failed at what contexts?
    - What's the progression trend?
  
  STEP 4: Read key context
    → {{model_dir}}/Insights.md — Learned patterns
    → {{model_dir}}/.llm-context/model-context/device_config.json — Hardware
    → {{model_dir}}/.llm-context/model-context/model_info.json — Model specs

failed_run_detail: |
  FAILED run_{{run_id}}: {{error_type}}
  
  Investigate:
  → {{model_dir}}/.runs/{{run_id}}/result.json — Confirm failure
  → {{model_dir}}/.runs/{{run_id}}/config.json — What was tested
  → {{model_dir}}/.runs/{{run_id}}/vllm_stderr.log — Error details (search "ERROR" or "Traceback")
  
  Classify: OOM? Backend error? Config error? New or pattern?

successful_run_detail: |
  SUCCESS run_{{run_id}}: {{throughput}} tok/s
  
  Capture:
  → {{model_dir}}/.runs/{{run_id}}/result.json — Confirm success
  → {{model_dir}}/.runs/{{run_id}}/config.json — Working parameters
  → {{model_dir}}/.runs/{{run_id}}/benchmark.json — Performance metrics
  
  Record: What worked? Room to optimize further?

no_history: |
  NO RUNS YET — Starting fresh.
  
  Quick research:
  → {{model_dir}}/Insights.md — Any manual notes
  → {{model_dir}}/.llm-context/hub_configs/config.json — Model architecture
  → {{model_dir}}/.llm-context/model-context/model_info.json — Model specs
  → {{model_dir}}/.llm-context/model-context/device_config.json — Hardware
  
parent_linking: |
  BEFORE CREATING run_{tree}_{id}:
  
  If CHILD (tree < id):
  1. Find parent = best previous run in same tree
  2. READ: .runs/run_{tree}_{parent_id}/result.json
  3. READ: .runs/run_{tree}_{parent_id}/summary.json
  4. Learn: What config? Success? Error? Why?
  5. Optimize: Change ONE thing based on parent
  6. Document: "Parent run_X_Y had Z tok/s, changing W..."
  
  If ROOT (tree == id):
  1. Read Insights.md for overall knowledge
  2. Start fresh with new strategy
  3. Document: "New tree because previous exhausted..."

outputs: |
  YOUR OUTPUT: experiments_queued JSON array
  - One or more experiment configs
  - Each with reasoning, prediction, tree linking
  - insights_read field (document what you learned)
  
  YOU DO NOT create summary.json or edit Insights.md
