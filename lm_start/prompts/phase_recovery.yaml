# Phase Recovery Prompts
# Used by PhaseAgent when setup phases fail

# =============================================================================
# Phase Failure Analysis
# =============================================================================

phase_failure_analysis: |
  Setup phase '{{phase}}' failed and requires recovery.

  Phase: {{phase}}
  Error Type: {{error_type}}
  Error Message: {{error}}

  Action History:
  {{action_history}}

  Available Recovery Strategies:
  - retry_download: Retry model download with different mirror
  - fix_venv_pip: Fix pip installation in venv
  - fix_cuda_paths: Fix CUDA library paths
  - free_disk_space: Clean up disk space
  - regenerate_config: Regenerate configuration files

  Suggest a fix in JSON format:
  {
    "analysis": "Brief analysis of what went wrong",
    "fix": {
      "action": "action_name",
      "command": "shell command to run",
      "description": "what this does"
    },
    "fallback_strategy": "strategy_name_if_primary_fails"
  }

# =============================================================================
# Download Phase Recovery
# =============================================================================

download_recovery: |
  Model download failed for '{{model_id}}'.

  Error: {{error}}
  Error Type: {{error_type}}
  Attempt: {{attempt}}/{{max_retries}}

  Suggested recovery approaches:
  1. Retry with longer timeout
  2. Use alternative mirror (hf-mirror.com, etc.)
  3. Check authentication/permissions
  4. Verify model ID is correct
  5. Check disk space availability

  Provide recovery steps in JSON format:
  {
    "analysis": "Why the download likely failed",
    "primary_action": {
      "type": "retry|mirror|auth|verify",
      "command": "command to execute",
      "env_vars": {"KEY": "value"}
    },
    "fallback_actions": [
      {"type": "action_type", "command": "fallback command"}
    ]
  }

# =============================================================================
# Venv Phase Recovery
# =============================================================================

venv_recovery: |
  Virtual environment creation/setup failed.

  Error: {{error}}
  Error Type: {{error_type}}
  Python Version: {{python_version}}
  Venv Path: {{venv_path}}

  Common causes:
  - Missing Python version (needs pyenv install)
  - pip not installed in venv
  - CUDA/PyTorch version mismatch
  - Missing system dependencies

  Suggest fixes in JSON format:
  {
    "analysis": "Root cause analysis",
    "fixes": [
      {
        "step": 1,
        "action": "install_python|fix_pip|install_cuda_deps",
        "command": "command to run",
        "check": "how to verify this worked"
      }
    ],
    "verification": "command to verify venv is working"
  }

# =============================================================================
# Config Generation Recovery
# =============================================================================

config_recovery: |
  Configuration file generation failed.

  Error: {{error}}
  Error Type: {{error_type}}
  Target Files: {{target_files}}

  Model Info:
  {{model_info}}

  Suggest regeneration approach in JSON format:
  {
    "analysis": "Why generation failed",
    "fixes": [
      {
        "action": "regenerate|template_fix|permission_fix",
        "target": "file_path",
        "command": "command or template fix"
      }
    ]
  }
