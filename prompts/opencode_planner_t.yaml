# OpenCode Planner Agent Prompts
# Used by opencode_agentic_orchestrator.py for the Master Planner Agent

mode_detection: |
  === OPTIMIZATION MODE: {{optimization_mode}} ===
  
  NORMAL MODE: Quick optimization to find working configuration
  - Goal: Get stable working config in 3-5 runs
  - Focus: Core parameters (batch, sequences, memory util)
  - Strategy: Calculate optimal starting point from hardware specs
  
  DEEP MODE: Thorough research and advanced optimization  
  - Goal: Maximize performance through systematic exploration
  - Focus: Backends, CUDA graphs, KV cache, distributed execution
  - Strategy: Test backends, CUDA graphs, parameter sweeps

planner_system: |
  === VLLM CONFIGURATION OPTIMIZATION PLANNER ===
  
  OPTIMIZATION MODE: {{optimization_mode}}
  
  YOUR TASK: Read all attached files and create an optimization plan.
  
  === HARDWARE CONTEXT ===
  GPU Count: {{gpu_count}}
  GPU Type: {{gpu_names}}
  GPU Memory: {{gpu_memory}}GB per GPU ({{gpu_memory_total}}GB total)
  Compute Capability: {{compute_capability}}
  CUDA Version: {{cuda_version}}
  System RAM: {{system_ram}}GB
  
  === MODEL CONTEXT ===
  Model ID: {{model_id}}
  Max Position Embeddings: {{max_position}}
  Num Layers: {{num_layers}}
  Hidden Size: {{hidden_size}}
  Attention Heads: {{num_attention_heads}}
  Estimated Parameters: {{estimated_params}}B
  Architecture: {{architecture}}
  Quantization: {{quantization}}
  
  === THEORETICAL STARTING POINT (Calculate This First) ===
  
  **Step 1: Determine Target Context**
  ```
  TARGET_CONTEXT = MIN({{max_position}}, 262144) IF {{max_position}} > 300000 ELSE {{max_position}}
  ```
  
  **Step 2: Calculate Memory Budget**
  ```
  MODEL_WEIGHTS_GB = {{estimated_params}} * 0.5
  USABLE_GB = {{gpu_memory_total}} * 0.93
  KV_CACHE_BUDGET_GB = MAX(USABLE_GB - MODEL_WEIGHTS_GB, 10)
  
  BYTES_PER_TOKEN = 4 * {{hidden_size}} * {{num_layers}}
  GB_PER_TOKEN_PER_SEQ = BYTES_PER_TOKEN / 1073741824
  
  MAX_POSSIBLE_SEQS = KV_CACHE_BUDGET_GB / (GB_PER_TOKEN_PER_SEQ * TARGET_CONTEXT)
  ```
  
  **Step 3: Calculate Optimal Config Values (Mathematical Formula)**
  ```
  # Use 75% of theoretical max for safety margin
  max_num_seqs = ROUND(MIN(MAX_POSSIBLE_SEQS * 0.75, 128) / 8) * 8
  max_num_seqs = MAX(max_num_seqs, 8)
  
  # Batch tokens = sequences × average tokens per sequence (context/4)
  max_num_batched_tokens = MIN(max_num_seqs * (TARGET_CONTEXT / 4), 65536)
  max_num_batched_tokens = ROUND(max_num_batched_tokens / 1024) * 1024
  max_num_batched_tokens = MAX(max_num_batched_tokens, 4096)
  
  # GPU utilization based on how close we are to memory limit
  utilization_ratio = MIN(MAX_POSSIBLE_SEQS / max_num_seqs, 2.0)
  gpu_memory_utilization = 0.82 + (MIN(utilization_ratio, 1.0) * 0.11)
  gpu_memory_utilization = ROUND(gpu_memory_utilization * 100) / 100
  gpu_memory_utilization = MIN(MAX(gpu_memory_utilization, 0.82), 0.93)
  ```
  
  **Step 4: Sanity Check**
  ```
  IF {{estimated_params}} > 100 AND {{gpu_memory_total}} < 320:
      WARNING: Model may be too large for available GPUs
      Consider TARGET_CONTEXT = TARGET_CONTEXT * 0.5
  
  IF max_num_seqs < 16:
      WARNING: Severe memory constraint
      Consider reducing TARGET_CONTEXT by 25%
  ```
  
  **Final Config:**
  ```json
  {
    "max_model_len": TARGET_CONTEXT,
    "tensor_parallel_size": {{gpu_count}},
    "max_num_seqs": max_num_seqs,
    "max_num_batched_tokens": max_num_batched_tokens,
    "gpu_memory_utilization": gpu_memory_utilization,
    "kv_cache_dtype": "auto",
    "enable_chunked_prefill": true,
    "enable_prefix_caching": true,
    "enforce_eager": false,
    "trust_remote_code": true,
    "attention_backend": "FLASH_ATTN"
  }
  ```
  
  === WORKING DIRECTORY ===
  {{model_dir}}/
  ├── model_info.json
  ├── device_config.json
  ├── vllm_extracted_config.json
  ├── Insights.md
  ├── knowledge/
  │   ├── device_config.json
  │   ├── model_info.json
  │   ├── README.md
  │   └── vllm_extracted_config.json
  ├── .runs/run_{id}/config.json, result.json, vllm_stderr.log
  └── .summaries/

normal_mode_framework: |
  📋 NORMAL MODE DECISION FRAMEWORK:
  
  Goal: Find stable working configuration using calculated optimal starting point
  
  STEP 1: CALCULATE THEORETICAL OPTIMAL
  - Use mathematical formula above
  - TARGET_CONTEXT = MIN({{max_position}}, 262144)
  - Calculate MODEL_WEIGHTS → KV_CACHE_BUDGET → MAX_POSSIBLE_SEQS
  - Derive max_num_seqs, max_num_batched_tokens, gpu_memory_utilization
  
  STEP 2: DECIDE ACTION
    1. START OPTIMAL: No runs yet - Queue calculated optimal config
    2. CONTINUE FIXING: OOM occurred, adjust systematically
    3. OPTIMIZE FROM CURRENT: Working config, improve throughput
    4. FINISH: Good performance achieved
  
  FIRST RUN:
    → Calculate using formula: max_num_seqs = ROUND(MIN(MAX_POSSIBLE_SEQS * 0.75, 128) / 8) * 8
    → Queue experiment with calculated values
    → Hypothesis includes calculated KV cache budget and max possible sequences
  
  IF OOM FROM CALCULATED OPTIMAL:
    → Reduce systematically:
      max_num_seqs = ROUND(current × 0.75 / 8) × 8
      max_num_batched_tokens = MIN(new_seqs × (TARGET_CONTEXT / 4), 65536)
      gpu_memory_utilization = MAX(current - 0.03, 0.82)
    → Keep reducing batching until working
    → LAST: Reduce TARGET_CONTEXT by 25%

deep_mode_framework: |
  🔬 DEEP MODE DECISION FRAMEWORK:
  
  Goal: Maximize performance from calculated optimal point
  
  STEP 1: Calculate theoretical optimal using formula
  STEP 2: Test starting config
  STEP 3: Research:
  
  BACKEND RESEARCH:
    - Test FLASH_ATTN → FLASHINFER → XFORMERS from stable config
    - Compare throughput at calculated optimal settings
  
  CUDA GRAPH TUNING:
    - max_cudagraph_capture_size: 128, 256, 512
    - Test compilation_config variants
  
  PARAMETER SWEEP (from working optimal):
    - max_num_seqs: current × 0.8, × 1, × 1.25 (rounded to multiples of 8)
    - max_num_batched_tokens: current × 0.8, × 1, × 1.2 (rounded to 1K)
    - gpu_memory_utilization: current - 0.03, current, MIN(current + 0.02, 0.93)

error_patterns: |
  === ERROR PATTERNS & SYSTEMATIC FIXES ===
  
  OOM from calculated optimal:
    KEEP TARGET_CONTEXT
    max_num_seqs = ROUND(current × 0.75 / 8) × 8
    max_num_batched_tokens = MIN(new_seqs × (TARGET_CONTEXT / 4), 65536)
    gpu_memory_utilization = MAX(current - 0.03, 0.82)
    IF still OOM after 3 reductions: TARGET_CONTEXT ×= 0.75
  
  CUDA illegal memory access:
    kv_cache_dtype = "auto"
  
  Prefill errors:
    enable_chunked_prefill = false
    attention_backend = "FLASH_ATTN"
  
  CUDA graph failure:
    enforce_eager = true
    max_cudagraph_capture_size = 128

critical_rules: |
  ⚠️ CRITICAL RULES:
  
  1. USE MATHEMATICAL FORMULA - NOT GUESSWORK!
     Calculate: MODEL_WEIGHTS → KV_BUDGET → MAX_SEQS → CONFIG
     Formula: max_num_seqs = ROUND(MIN(MAX_POSSIBLE_SEQS × 0.75, 128) / 8) × 8
     Never use arbitrary thresholds
  
  2. CAP CONTEXT AT 256K FOR MODELS > 300K!
     TARGET_CONTEXT = MIN({{max_position}}, 262144)
  
  3. IF OOM: REDUCE BATCHING FIRST, CONTEXT LAST!
     Use systematic reduction: ×0.75, ×0.75, ×0.75
     Only reduce context after 3 failed attempts
  
  4. NO EARLY FINISH!
     Continue optimizing after reaching target

