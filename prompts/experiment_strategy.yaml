# Experiment Strategy Prompts
# Used by ExperimentAgent for intelligent vLLM configuration testing

# =============================================================================
# Initial Strategy Consultation
# =============================================================================

initial_strategy: |
  You are a vLLM optimization expert. Analyze this model and suggest the best test strategy.

  MODEL DIRECTORY: {{model_dir}}

  MODEL INFO:
  {{model_info}}

  DEVICE CONFIG:
  {{device_config}}

  MODEL CONFIG (from HF):
  {{model_config}}

  CALCULATED VALUES:
  - Model Parameters: {{model_params}}
  - Model Size: {{model_size_gb}} GB (with overhead)
  - Required Tensor Parallel: {{required_tp}}
  - Available GPUs: {{gpu_count}} x {{gpu_memory_gb}}GB each
  - CUDA Devices: {{cuda_devices}}

  TARGET CONTEXTS TO TEST: {{context_targets}}

  Based on model size, GPU memory, and architecture, suggest:
  1. Optimal tensor parallel size (start with what fits the model)
  2. Which context lengths to try first
  3. Which backends to prioritize (FLASHINFER, FLASH_ATTN, XFORMERS, etc.)
  4. Any special considerations (MoE, quantization needs, etc.)

  Return JSON:
  {
    "analysis": "Brief analysis of model requirements vs available resources",
    "optimal_tp": N,
    "suggested_configs": [
      {
        "context_length": N,
        "backend": "BACKEND",
        "tensor_parallel_size": N,
        "gpu_memory_utilization": 0.N,
        "reason": "why this config"
      }
    ],
    "backends_priority": ["BACKEND1", "BACKEND2"],
    "skip_tests": ["what to skip and why"],
    "special_flags": ["--flag1", "--flag2"],
    "should_continue": true
  }

# =============================================================================
# Iterative Strategy Update
# =============================================================================

iterative_strategy: |
  You are a vLLM optimization expert. Review current progress and suggest next tests.

  MODEL: {{model_id}}
  MODEL SIZE: {{model_size_gb}} GB

  CURRENT BEST CONFIG:
  {{best_config}}

  TESTED CONFIGURATIONS: {{tested_count}}
  WORKING CONFIGURATIONS: {{working_count}}

  RECENT RESULTS (last 10):
  {{recent_results}}

  RECENT FAILURES (last 5):
  {{recent_failures}}

  ERROR PATTERNS DETECTED:
  {{error_patterns}}

  Target is to achieve at least {{min_target_context}} tokens context.
  Currently achieved: {{current_best_context}} tokens.

  Suggest next steps in JSON:
  {
    "analysis": "Analysis of what's working and what's failing",
    "confidence": 0.0-1.0,
    "next_tests": [
      {
        "context_length": N,
        "backend": "BACKEND",
        "tensor_parallel_size": N,
        "gpu_memory_utilization": 0.N,
        "reason": "why test this",
        "expected_outcome": "success|likely_failure|uncertain"
      }
    ],
    "adjustments": {
      "try_lower_gpu_util": true/false,
      "try_different_backend": true/false,
      "try_different_tp": true/false
    },
    "estimated_max_achievable": N,
    "should_continue": true/false,
    "early_stop_reason": "if should_continue is false, explain why"
  }

# =============================================================================
# Binary Search Strategy
# =============================================================================

binary_search_strategy: |
  You are optimizing vLLM configuration using binary search approach.

  MODEL: {{model_id}}
  SEARCH PARAMETER: {{search_param}} (e.g., context_length)

  LAST SUCCESS: {{last_success}} @ {{success_config}}
  FIRST FAILURE: {{first_failure}} @ {{failure_config}}

  Search space: [{{search_low}}, {{search_high}}]
  Current midpoint candidate: {{midpoint}}

  Recent results around this range:
  {{recent_results}}

  Suggest next test in JSON:
  {
    "analysis": "Current search state assessment",
    "next_value": N,
    "config": {
      "tensor_parallel_size": N,
      "backend": "BACKEND",
      "gpu_memory_utilization": 0.N
    },
    "converged": true/false,
    "final_recommendation": "if converged, what config to use"
  }

# =============================================================================
# Failure Analysis
# =============================================================================

failure_analysis: |
  A vLLM configuration test failed. Analyze and suggest adjustments.

  FAILED CONFIG:
  {{failed_config}}

  ERROR TYPE: {{error_type}}
  ERROR MESSAGE: {{error_message}}

  STDOUT:
  {{stdout_tail}}

  STDERR:
  {{stderr_tail}}

  PREVIOUS SIMILAR FAILURES:
  {{similar_failures}}

  SUCCESSFUL CONFIGS NEARBY:
  {{nearby_successes}}

  Suggest adjustments in JSON:
  {
    "root_cause": "OOM|backend_bug|config_error|model_incompatible|other",
    "is_recoverable": true/false,
    "suggested_fixes": [
      {
        "parameter": "context_length|tp_size|backend|gpu_util",
        "current_value": "...",
        "suggested_value": "...",
        "reason": "why this should help"
      }
    ],
    "should_skip_similar": true/false,
    "skip_pattern": "pattern to avoid in future tests"
  }

# =============================================================================
# Final Configuration Selection
# =============================================================================

final_selection: |
  Select the best vLLM configuration from tested options.

  MODEL: {{model_id}}

  ALL WORKING CONFIGURATIONS:
  {{working_configs}}

  BENCHMARK RESULTS:
  {{benchmark_results}}

  SELECTION CRITERIA:
  1. Highest context length (priority)
  2. Best throughput at that context
  3. Lowest latency
  4. Stable configuration (consistent results)

  Provide final recommendation in JSON:
  {
    "selected_config": {
      "context_length": N,
      "backend": "BACKEND",
      "tensor_parallel_size": N,
      "gpu_memory_utilization": 0.N,
      "additional_flags": ["--flag1", "--flag2"]
    },
    "rationale": "Why this config was chosen",
    "tradeoffs": "What was sacrificed and why",
    "alternatives": [
      {"context": N, "when_to_use": "scenario"}
    ]
  }
