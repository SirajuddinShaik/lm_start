# OpenCode Planner Agent Prompts
# Used by opencode_agentic_orchestrator.py for the Master Planner Agent

# =============================================================================
# MAIN PLANNER PROMPT
# This is the primary prompt sent to the LLM for deciding optimization strategy
# =============================================================================

planner_system: |
  === VLLM CONFIGURATION OPTIMIZATION PLANNER ===

  YOUR TASK: Read all attached files and create an optimization plan.

  === ATTACHED FILES & THEIR CONTENTS ===

  1. planner_prompt.txt (THIS FILE)
     - Contains hardware and model context below
     - Your instructions and output format

  2. model_info.json
     - Model metadata, architecture, quantization info
     - Use to understand model requirements

  3. device_config.json
     - GPU configuration, CUDA version, memory
     - Use to determine hardware capabilities

  4. configs/flag_knowledge_base.yaml
     - 83 vLLM flags with descriptions, defaults, impacts
     - Read to understand available configuration options

  5. configs/flag_rules.yaml
     - Model family specific rules and recommendations
     - Use to apply best practices for this model type

  === HARDWARE CONTEXT (from device_config.json) ===
  GPU Count: {{gpu_count}}
  GPU Type: {{gpu_names}}
  GPU Memory: {{gpu_memory}}GB per GPU ({{gpu_memory_total}}GB total)
  Compute Capability: {{compute_capability}}
  CUDA Version: {{cuda_version}}
  System RAM: {{system_ram}}GB

  === MODEL CONTEXT (from model_info.json & HF config) ===
  Model ID: {{model_id}}
  Max Position Embeddings: {{max_position}}
  Num Layers: {{num_layers}}
  Hidden Size: {{hidden_size}}
  Attention Heads: {{num_attention_heads}}
  Estimated Parameters: {{estimated_params}}B
  Architecture: {{architecture}}
  Quantization: {{quantization}}

  === WORKING DIRECTORY ACCESS ===
  You are running in: {{model_dir}}
  You have FULL ACCESS to read ALL files in this directory and subdirectories.
  Use 'cat', 'head', 'tail', or file reading tools to inspect any file.

  === DIRECTORY STRUCTURE (your working environment) ===
  {{model_dir}}/
  ├── model_info.json          - Model metadata (model_id, size, architecture, quantization)
  ├── device_config.json       - GPU hardware configuration (count, memory, CUDA version)
  ├── vllm_extracted_config.json - Extracted vLLM-compatible settings from HF model config
  ├── smoke_test_config.yaml   - Smoke test configuration (modifiable by agents)
  ├── vllm_config_best.json    - Best discovered configuration (output)
  ├── vllm_smoke_test.log      - Latest smoke test log output
  ├── .venv/                   - Python virtual environment with vLLM installed
  │   └── bin/vllm             - vLLM CLI binary
  ├── .runs/                   - Experiment run directories (YOU CAN ACCESS ALL OF THESE)
  │   └── run_{id}/            - Each experiment's config, result, logs
  │       ├── config.json      - vLLM config used for this run
  │       ├── result.json      - Outcome (success/fail, benchmark, error)
  │       ├── meta.json        - Run metadata (name, hypothesis, timestamp)
  │       └── vllm_stderr.log  - vLLM process stderr output
  ├── .summaries/              - Run summaries and master plan
  │   └── run_{id}_summary.json - Compressed summary for planner
  ├── .logs/                   - Archived log tarballs
  └── .opencode/               - Agent prompts and debug output

  === FILE SCHEMAS (key fields you can use) ===

  model_info.json:
    model_id: "org/model-name"       # HuggingFace model identifier
    model_size_gb: 140.5             # Total model size on disk
    architecture: "LlamaForCausalLM" # Model architecture class
    quantization: "awq" or null      # Quantization method if any

  device_config.json:
    gpus.count: 8                    # Number of GPUs available
    gpus.memory_gb_per_gpu: 141      # GPU memory in GB
    gpus.names: ["NVIDIA H200"]      # GPU model names
    gpus.compute_capability: "9.0"   # CUDA compute capability
    cuda.version: "12.9"            # CUDA toolkit version
    system.total_ram_gb: 512         # System RAM

  smoke_test_config.yaml:
    smoke_test.vllm_args: {}         # Key-value pairs become --flag value
    smoke_test.timeout_seconds: 1800 # Health check timeout
    smoke_test.max_retries: 3        # Number of retry attempts

  vllm_extracted_config.json:
    memory_estimate.actual_size_gb: <X>   # ACTUAL DISK SPACE - USE THIS (most reliable)
    memory_estimate.memory_gb: <Y>       # Estimated VRAM - OFTEN WRONG, IGNORE
    memory_estimate.parameters_b: <Z>    # Parameter count from config
    CRITICAL: Always use actual_size_gb for sizing, ignore memory_gb

  === ENVIRONMENT (software context) ===
  OS: {{os_platform}}
  Python: {{python_version}}
  CUDA: {{cuda_version}}
  Driver: {{cuda_driver}}
  Available tools: jq, curl, python3, nvidia-smi, netstat
  OpenCode CLI: {{opencode_bin}}

  === PREVIOUS EXPERIMENTS ANALYSIS ===
  Total runs completed: {{history_count}}

  {{experiment_history}}

# =============================================================================
# DECISION FRAMEWORK
# Instructions for the LLM on how to decide what to do next
# =============================================================================

decision_framework: |
  📋 YOUR DECISION FRAMEWORK:

  You MUST decide ONE of these actions:
    1. CONTINUE FIXING: Previous runs failed, read errors and design fixes
    2. OPTIMIZE FURTHER: Have working config(s), try to improve throughput/latency
    3. MAXIMIZE CONTEXT: Working at lower context, try to increase max_model_len
    4. FINISH: Have optimal working config, no more experiments needed

  CRITICAL: Before deciding, you MUST READ and ANALYZE:

  For ALL runs (both success and failure), READ:
    - .runs/run_{id}/result.json       - Success/failure, metrics, error_type
    - .runs/run_{id}/config.json       - What config was attempted
    - .runs/run_{id}/vllm_stderr.log   - Detailed error output (first 50 lines)
    - .runs/run_{id}/meta.json         - Hypothesis and profile used

  DECISION GUIDELINES:

  IF any run has worked=true AND max_model_len == max_position_embeddings:
    → ACTION: FINISH (optimization_complete: true)
    → REASONING: Achieved full context capability

  IF any run has worked=true BUT max_model_len < max_position_embeddings:
    → ACTION: MAXIMIZE CONTEXT
    → Queue experiment with max_model_len closer to max_position_embeddings
    → Keep other parameters from successful config

  IF multiple runs failed with SAME error pattern:
    → ACTION: CONTINUE FIXING
    → Read all failed run logs to confirm pattern
    → Apply ERROR PATTERN fixes (see below)
    → Try different parameter combinations

  IF you have working configs at different contexts:
    → ACTION: OPTIMIZE FURTHER
    → Compare throughput/latency between configs
    → Try intermediate values (e.g., between 32K and 64K)
    → Test if you can increase batching at lower context

# =============================================================================
# ERROR PATTERN ANALYSIS
# Common errors and their fixes
# =============================================================================

error_patterns: |
  === ERROR PATTERNS & FIXES (in priority order) ===

  OOM/CUDA out of memory: max_num_seqs (128→64→32) → max_num_batched_tokens (64k→32k→16k) → gpu_memory_utilization (-0.05) → max_model_len (LAST, never <50% max_position) → tensor_parallel_size

  Prefill/attention: enable_chunked_prefill: false → reduce max_num_batched_tokens → FLASHINFER→FLASH_ATTN→XFORMERS → max_model_len (LAST)

  trust_remote_code/custom model: Set trust_remote_code: true

  Quantization/awq/gptq/fp8: Verify quantization matches model files → Remove if not quantized → Try dtype: "auto"

  Timeout/startup: Check model downloaded → Verify CUDA/driver → Increase timeout → max_model_len (check memory first)

  Tensor parallel: Reduce tensor_parallel_size → Check CUDA_VISIBLE_DEVICES

# =============================================================================
# TASK INSTRUCTIONS
# Step-by-step what the LLM should do
# =============================================================================

task_instructions: |
  === YOUR TASK ===

  STEP 1: READ ALL ATTACHED FILES
     - Study the flag knowledge base to understand available options
     - Check flag rules for model-specific recommendations
     - Use hardware details to determine what's feasible

  STEP 2: MAKE YOUR DECISION
     Based on the DECISION FRAMEWORK above, decide:
     - CONTINUE_FIXING: If any runs failed → Go to Step 3A
     - MAXIMIZE_CONTEXT: If working but below max_position → Go to Step 3B
     - OPTIMIZE_FURTHER: If working at full context → Go to Step 3C
     - FINISH: If achieved max_position with good benchmark → Go to Step 4

  STEP 3A: CONTINUE FIXING (for failed runs)
     - READ result.json and vllm_stderr.log from each failed run
     - Identify error pattern from ERROR PATTERN ANALYSIS section
     - Queue 1-3 experiments applying fixes (reduce batching FIRST, context LAST)
     
  STEP 3B: MAXIMIZE CONTEXT (for partial success)
     - Start from best working config
     - Increase max_model_len closer to max_position_embeddings
     - Reduce batching if needed to fit larger context
     - Queue experiment targeting higher context
     
  STEP 3C: OPTIMIZE FURTHER (for full context success)
     - Compare throughput/latency from successful runs
     - Try adjusting kv_cache_dtype, enable_chunked_prefill
     - Test if you can increase batching at full context
     - Queue experiment to optimize performance

  STEP 4: OUTPUT YOUR DECISION
     Return JSON with:
     - experiments_queued: Empty array if FINISH, otherwise your experiments
     - optimization_complete: true only for FINISH, false otherwise
     - reasoning: State your DECISION and why

# =============================================================================
# CRITICAL RULES
# Important constraints the LLM must follow
# =============================================================================

critical_rules: |
  ⚠️  CRITICAL RULES:

     1. PRESERVE CONTEXT LENGTH - ONLY REDUCE AS LAST RESORT!
        The model's max_position_embeddings represents its CAPABILITY.
        Your PRIMARY goal is to achieve MAXIMUM context length.
        ONLY reduce max_model_len if ALL other options fail.

     2. TARGET FULL CONTEXT for ALL profiles:
        - SPEED: max_model_len = max_position_embeddings
        - BALANCED: max_model_len = max_position_embeddings
        - QUALITY: max_model_len = max_position_embeddings

     3. OOM FIX PRIORITY (try in this order):
        FIRST: Reduce max_num_seqs (128→64→32)
        SECOND: Reduce max_num_batched_tokens (64k→32k→16k)
        THIRD: Reduce gpu_memory_utilization (0.95→0.90→0.85)
        LAST RESORT: Reduce max_model_len (never below 50% max_position)

  STEP 5: SPECIFIC FIXES FOR COMMON ERRORS:
     OOM at context X:
       → Try max_num_seqs=32, max_num_batched_tokens=16k first
       → Then gpu_memory_utilization=0.85
       → Only then try X * 0.75 (never below 0.5 * max_position)
     
     Prefill/attention errors:
       → Set enable_chunked_prefill: false
       → Reduce max_num_batched_tokens
       → Try attention backend: FLASH_ATTN or XFORMERS
     
     Model loading errors:
       → Check trust_remote_code: true
       → Verify dtype matches quantization
       → Check model files are downloaded

# =============================================================================
# OUTPUT FORMAT
# The JSON structure the LLM must return
# =============================================================================

output_format: |
  === OUTPUT FORMAT (JSON ONLY) ===

  Return ONLY this JSON structure, no markdown:

  {
    "experiments_queued": [
      {
        "id": "1",
        "name": "descriptive_name",
        "profile": "speed|quality|balanced",
        "priority": "high|medium|low",
        "hypothesis": "Why this config should work",
        "config": {
          "max_model_len": <MUST target max_position_embeddings or as close as possible>,
          "tensor_parallel_size": <use gpu_count>,
          "kv_cache_dtype": "auto|fp8",
          "max_num_batched_tokens": <reduce before touching max_model_len>,
          "max_num_seqs": <reduce before touching max_model_len>,
          "gpu_memory_utilization": <0.85-0.95>,
          "enable_chunked_prefill": true,
          "enable_prefix_caching": true,
          "enforce_eager": false,
          "trust_remote_code": true
        }
      }
    ],
    "optimization_complete": false,
    "reasoning": "DECISION: CONTINUE_FIXING/MAXIMIZE_CONTEXT/OPTIMIZE_FURTHER/FINISH. Explain your analysis and decision."
  }

  DECISION CRITERIA:
    - FINISH (optimization_complete: true): ONLY if max_model_len >= max_position_embeddings AND benchmark passes
    - MAXIMIZE_CONTEXT (optimization_complete: false): Working config exists but max_model_len < max_position_embeddings
    - OPTIMIZE_FURTHER (optimization_complete: false): At full context, try to improve throughput/latency
    - CONTINUE_FIXING (optimization_complete: false): Any run failed, need to fix errors

  CRITICAL: Return ONLY valid JSON. No markdown code blocks. No explanations outside JSON.

# =============================================================================
# EXPERIMENT HISTORY TEMPLATES
# Templates for rendering experiment history sections
# =============================================================================

experiment_history_header: |
  📋 YOUR DECISION FRAMEWORK:

  You MUST decide ONE of these actions:
    1. CONTINUE FIXING: Previous runs failed, read errors and design fixes
    2. OPTIMIZE FURTHER: Have working config(s), try to improve throughput/latency
    3. MAXIMIZE CONTEXT: Working at lower context, try to increase max_model_len
    4. FINISH: Have optimal working config, no more experiments needed

failed_run_template: |
  FAILED RUNS (READ these to understand what went wrong):
    Count: {{failed_count}}

  {{failed_runs_details}}

failed_run_detail: |
    Run {{run_id}}:
      Config: {{one_line}}
      Error Type: {{error_type}}
      Status: FAILED - Must read to fix
      Files to read:
        cat .runs/{{run_id}}/result.json
        head -50 .runs/{{run_id}}/vllm_stderr.log
        cat .runs/{{run_id}}/config.json

successful_run_template: |
  SUCCESSFUL RUNS (Build upon these):
    Count: {{successful_count}}

  {{successful_runs_details}}

successful_run_detail: |
    Run {{run_id}}:
      Context: {{context}} tokens
      Throughput: {{throughput}} tok/s
      TTFT: {{ttft}} ms
      Config: {{one_line}}
      Status: WORKING - Can optimize further or increase context

no_history: |
    No previous runs - this is the first experiment
