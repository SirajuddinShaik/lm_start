# Agent Optimization Prompts
# Prompts for max-context-first optimization strategy
# Version: 1.0.0

metadata:
  version: "1.0.0"
  last_updated: "2025-04-02"
  strategy: "max_context_first"

# ============================================================================
# Main Strategy Prompt
# ============================================================================
max_context_strategy: |
  You are an expert vLLM configuration optimizer. Your mission: achieve MAXIMUM CONTEXT LENGTH while maintaining stability.

  MODEL: {{model_id}}
  TARGET CONTEXT: {{max_position_embeddings}} tokens
  HARDWARE: {{gpu_count}}x {{gpu_name}} ({{gpu_memory_gb}}GB each)
  CURRENT ATTEMPT: {{attempt_number}}

  {{#if previous_failures}}
  PREVIOUS FAILURES (learn from these):
  {{#each previous_failures}}
  - Attempt {{attempt}}: {{config_summary}} → {{error_type}}: {{error_message}}
  {{/each}}

  FAILURE ANALYSIS:
  {{failure_analysis}}
  {{/if}}

  {{#if previous_successes}}
  WORKING CONFIGURATIONS:
  {{#each previous_successes}}
  - Context {{context}}: {{config_summary}} → Throughput: {{throughput}} tok/s
  {{/each}}
  {{/if}}

  {{#if current_config}}
  CURRENT CONFIG TO TEST:
  {{current_config}}
  {{/if}}

  OPTIMIZATION STRATEGY (Max-Context-First):
  =========================================
  Priority order for parameter adjustment:
  1. max_num_batched_tokens (65536 → 32768 → 16384 → 8192 → 4096)
  2. max_num_seqs (256 → 128 → 64 → 32)
  3. enable_chunked_prefill (True → False)
  4. gpu_memory_utilization (0.95 → 0.90 → 0.85 → 0.80)
  5. attention_backend (FLASHINFER → FLASH_ATTN → XFORMERS)
  6. ONLY THEN reduce max_model_len

  YOUR TASK:
  =========
  {{task_description}}

  Respond with a JSON object containing:
  {
    "config": {
      "tensor_parallel_size": <int>,
      "max_model_len": <int>,
      "gpu_memory_utilization": <float>,
      "max_num_batched_tokens": <int>,
      "max_num_seqs": <int>,
      "enable_chunked_prefill": <bool>,
      "kv_cache_dtype": "auto|fp8",
      "additional_flags": ["--flag1", "--flag2"]
    },
    "expected_outcome": "success|likely_failure|uncertain",
    "confidence": <float 0-1>,
    "fallback_plan": "What to try if this fails (specific parameter to change)",
    "rationale": "Why you chose these specific values"
  }

  IMPORTANT:
  - ALWAYS try max_position_embeddings first before reducing context
  - Reduce batch parameters before touching context length
  - Use all available GPUs (tensor_parallel_size = {{gpu_count}})
  - Be aggressive but systematic

# ============================================================================
# Benchmark Analysis Prompt
# ============================================================================
benchmark_analysis: |
  You are analyzing benchmark results to determine if a vLLM configuration is optimal.

  MODEL: {{model_id}}
  TARGET CONTEXT: {{max_position_embeddings}}

  BENCHMARK RESULTS:
  =================
  {{benchmark_results}}

  CURRENT CONFIGURATION:
  =====================
  {{current_config}}

  TARGET METRICS:
  ==============
  - Throughput: > {{target_throughput}} tok/s
  - TTFT (Time To First Token): < {{target_ttft_ms}}ms for {{target_context}} context
  - TPOT (Time Per Output Token): < {{target_tpot_ms}}ms
  - Latency p99: < {{target_latency_p99_ms}}ms
  - GPU Utilization: > {{target_gpu_util}}%
  - Stability: No OOM or crashes over {{stability_duration_min}} minutes

  ANALYSIS INSTRUCTIONS:
  =====================
  1. Evaluate if current config meets all targets
  2. Identify the primary bottleneck (compute, memory, or communication)
  3. Suggest specific parameter changes to improve
  4. Decide if we should continue searching or accept this config

  Respond with JSON:
  {
    "meets_targets": true/false,
    "bottleneck": "compute|memory|communication|none",
    "metrics_assessment": {
      "throughput": "good|acceptable|poor",
      "latency": "good|acceptable|poor",
      "stability": "good|acceptable|poor"
    },
    "suggested_changes": [
      {
        "parameter": "name",
        "current_value": "value",
        "proposed_value": "value",
        "expected_improvement": "description",
        "priority": 1
      }
    ],
    "continue_searching": true/false,
    "rationale": "Detailed explanation of your assessment"
  }

# ============================================================================
# Failure Recovery Prompt
# ============================================================================
failure_recovery: |
  A vLLM configuration failed. Determine the next best configuration to try.

  MODEL: {{model_id}}
  TARGET CONTEXT: {{max_position_embeddings}}

  FAILED CONFIGURATION:
  ====================
  {{failed_config}}

  ERROR DETAILS:
  =============
  Error Type: {{error_type}}
  Error Message: {{error_message}}
  Phase: {{failure_phase}} (startup|runtime|benchmark)

  REDUCTION QUEUE STATUS:
  ======================
  {{reduction_queue_status}}

  INSTRUCTIONS:
  ============
  1. Analyze the error to understand what resource limit was hit
  2. Consult the reduction priority queue
  3. Select the next parameter to reduce
  4. Generate the next configuration to test

  Priority order (only reduce if higher priority exhausted):
  1. max_num_batched_tokens (keep context max)
  2. max_num_seqs (keep context max)
  3. enable_chunked_prefill (keep context max)
  4. gpu_memory_utilization (keep context max)
  5. attention_backend (keep context max)
  6. max_model_len (REDUCE CONTEXT - last resort)

  Respond with JSON:
  {
    "error_analysis": "What caused the failure",
    "next_parameter": "Which parameter to adjust",
    "parameter_value": "New value for that parameter",
    "next_config": {
      "tensor_parallel_size": <int>,
      "max_model_len": <int>,
      "gpu_memory_utilization": <float>,
      "max_num_batched_tokens": <int>,
      "max_num_seqs": <int>,
      "enable_chunked_prefill": <bool>
    },
    "preserve_context": true/false,
    "confidence": <float 0-1>,
    "fallback_if_fails": "What to try next if this also fails"
  }

  IMPORTANT: Only set preserve_context=false if you've exhausted all batch/memory parameters.

# ============================================================================
# Context Reduction Decision Prompt
# ============================================================================
context_reduction_decision: |
  All batch and memory parameters have been exhausted. Decide how much to reduce context.

  MODEL: {{model_id}}
  ORIGINAL TARGET: {{max_position_embeddings}}
  CURRENT ATTEMPT: {{current_context}}

  FAILED ATTEMPTS AT CURRENT CONTEXT:
  ==================================
  {{failed_attempts_at_current_context}}

  SUCCESSFUL CONFIGURATIONS AT LOWER CONTEXT:
  ============================================
  {{successful_lower_context_configs}}

  REDUCTION STRATEGY:
  =================
  Consider these reduction levels:
  - Conservative: Reduce by 25% (75% of original)
  - Moderate: Reduce by 50% (50% of original)
  - Aggressive: Reduce by 75% (25% of original)

  Common context lengths to target:
  - 131072 → 98304 (75%), 65536 (50%), 32768 (25%)
  - 65536 → 49152 (75%), 32768 (50%), 16384 (25%)
  - 32768 → 24576 (75%), 16384 (50%), 8192 (25%)

  Respond with JSON:
  {
    "decision": "reduce|give_up",
    "new_context_length": <int>,
    "reduction_percentage": <float>,
    "rationale": "Why this reduction level was chosen",
    "reset_parameters": true/false,
    "initial_config": {
      "max_num_batched_tokens": <int>,
      "max_num_seqs": <int>,
      "gpu_memory_utilization": <float>
    }
  }

  If you set reset_parameters=true, we'll restore batch parameters to aggressive values.

# ============================================================================
# Final Selection Prompt
# ============================================================================
final_selection: |
  Select the best configuration from all working candidates.

  MODEL: {{model_id}}
  MAX ACHIEVABLE CONTEXT: {{max_achievable_context}}

  WORKING CONFIGURATIONS:
  ======================
  {{#each working_configs}}
  Config {{@index}}:
    Context: {{context}}
    Settings: {{config_summary}}
    Benchmark: {{benchmark_summary}}
    Score: {{overall_score}}
  {{/each}}

  SELECTION CRITERIA (in priority order):
  ======================================
  1. Context length (higher is better - we want max capability)
  2. Throughput (tok/s - higher is better)
  3. Latency p99 (ms - lower is better)
  4. Stability (no crashes during benchmark)
  5. Resource efficiency (GPU utilization)

  WEIGHTS:
  ========
  - Context: 40%
  - Throughput: 25%
  - Latency: 20%
  - Stability: 15%

  Respond with JSON:
  {
    "selected_config_index": <int>,
    "selected_config": { ... },
    "selection_reason": "Why this config was chosen",
    "score_breakdown": {
      "context_score": <float>,
      "throughput_score": <float>,
      "latency_score": <float>,
      "stability_score": <float>,
      "overall_score": <float>
    },
    "tradeoffs": "What tradeoffs this config makes",
    "recommendations": "Suggestions for production use"
  }

# ============================================================================
# Model Family Detection Prompt
# ============================================================================
model_family_detection: |
  Detect the model family and capabilities from model ID.

  MODEL ID: {{model_id}}

  AVAILABLE MODEL FAMILIES:
  ========================
  - deepseek-v3: MoE, 671B params, requires --enable-expert-parallel
  - deepseek-r1: Reasoning, 671B params, use deepseek_r1 parser
  - qwq: Reasoning, use qwq parser
  - kimi-k2.5: Reasoning + Tools, 256K context, kimi_k2 parser
  - llama3.1: Tools, 128K context, llama3_json parser
  - llama3.2: Tools, 128K context, pythonic parser, vision variants
  - llama3.3: Tools, 128K context, llama3_json parser
  - qwen2.5: Tools, hermes parser
  - qwen2.5-coder: Code-specialized
  - mistral: Tools, mistral parser
  - mixtral: MoE, requires --enable-expert-parallel
  - gemma/gemma2: Standard chat
  - command-r: Long context (128K)
  - dbrx: MoE, requires --enable-expert-parallel

  Respond with JSON:
  {
    "detected_family": "family_name",
    "confidence": <float 0-1>,
    "is_moe": true/false,
    "is_reasoning": true/false,
    "supports_tools": true/false,
    "supports_vision": true/false,
    "estimated_params_b": <float>,
    "default_context": <int>,
    "required_flags": ["--flag1", "--flag2"],
    "recommended_flags": ["--flag1", "--flag2"],
    "tool_parser": "parser_name|null",
    "reasoning_parser": "parser_name|null",
    "chat_template_kwargs": {}
  }

# ============================================================================
# Backend Selection Prompt
# ============================================================================
backend_selection: |
  Select optimal attention backend for this model and hardware.

  MODEL: {{model_id}}
  HARDWARE: {{gpu_name}}
  CONTEXT TARGET: {{max_position_embeddings}}

  BACKEND OPTIONS:
  ===============
  - FLASHINFER: Best performance, supports all features, requires recent vLLM
  - FLASH_ATTN: Good performance, widely compatible
  - FLASH_ATTN_VLLM_V1: Alternative Flash Attention implementation
  - XFORMERS: Fallback, good compatibility, slightly lower performance
  - TORCH_SDPA: PyTorch native, most compatible, lowest performance

  HARDWARE CONSIDERATIONS:
  =======================
  - H100/H200: FLASHINFER recommended
  - A100: FLASH_ATTN recommended
  - Older GPUs: XFORMERS may be more stable

  MODEL CONSIDERATIONS:
  ====================
  - Long context (>64K): FLASHINFER or FLASH_ATTN
  - MoE models: Any backend, but FLASHINFER optimized
  - Quantized models: FLASH_ATTN often more stable

  Respond with JSON:
  {
    "selected_backend": "FLASHINFER|FLASH_ATTN|FLASH_ATTN_VLLM_V1|XFORMERS|TORCH_SDPA",
    "fallback_backends": ["BACKUP1", "BACKUP2"],
    "environment_variables": {
      "VLLM_ATTENTION_BACKEND": "SELECTED_BACKEND"
    },
    "rationale": "Why this backend was chosen",
    "warnings": ["Any compatibility concerns"]
  }

# ============================================================================
# Compilation Config Prompt
# ============================================================================
compilation_config: |
  Determine optimal torch.compile configuration.

  MODEL: {{model_id}}
  HARDWARE: {{gpu_name}}
  vLLM VERSION: {{vllm_version}}

  COMPILATION OPTIONS:
  ===================
  - None: No compilation, fastest startup, slower inference
  - Basic: "{}" - Default compilation
  - Full: '{"cudagraph_mode": "FULL_AND_PIECEWISE"}' - Maximum performance
  - Custom: Specific flags for special cases

  WHEN TO USE FULL COMPILATION:
  ==============================
  - Production deployments
  - Long-running services
  - When startup time (30-60s) is acceptable
  - H100/H200/A100 GPUs

  WHEN TO DISABLE:
  ================
  - Quick testing/development
  - Debugging
  - Consumer GPUs with limited memory
  - Short inference sessions

  Respond with JSON:
  {
    "use_compilation": true/false,
    "compilation_config": "config_string|null",
    "max_cudagraph_capture_size": <int>,
    "expected_startup_overhead_seconds": <int>,
    "expected_performance_gain": "<percentage or description>",
    "rationale": "Why this configuration was chosen"
  }

# ============================================================================
# Batch Size Tuning Prompt
# ============================================================================
batch_size_tuning: |
  Fine-tune batch parameters for optimal throughput/latency tradeoff.

  MODEL: {{model_id}}
  CONTEXT LENGTH: {{max_model_len}}
  HARDWARE: {{gpu_count}}x {{gpu_name}}

  CURRENT SETTINGS:
  ================
  max_num_batched_tokens: {{current_max_batched_tokens}}
  max_num_seqs: {{current_max_seqs}}

  CURRENT BENCHMARK:
  =================
  {{current_benchmark}}

  BATCH SIZE CONSIDERATIONS:
  =========================
  - Higher batch sizes = better throughput, worse latency
  - Lower batch sizes = worse throughput, better latency
  - max_num_batched_tokens should be >= max_model_len for full context
  - max_num_seqs limits concurrent requests

  TARGET SCENARIOS:
  =================
  {{target_scenario}} (throughput|latency|balanced)

  Respond with JSON:
  {
    "recommended_max_batched_tokens": <int>,
    "recommended_max_seqs": <int>,
    "scenario": "throughput|latency|balanced",
    "expected_tps_change": "+<percent>% or -<percent>%",
    "expected_latency_change": "+<percent>% or -<percent>%",
    "rationale": "Why these values were chosen"
  }

