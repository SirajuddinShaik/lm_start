[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-start"
version = "0.1.0"
description = "Language Model Project Starter"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click",
    "typer",
    "pyyaml",
    "psutil",
    "rich",
    "jinja2",
]

[project.scripts]
lm-start = "lm_start:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["lm_start*"]
exclude = ["lm_start.backup*", "tests*", "docs*"]

[tool.setuptools.package-data]
lm_start = [
    "templates/**/*",
    "prompts/**/*",
    "configs/**/*",
    "scripts/*.sh",
]
